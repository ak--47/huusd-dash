name: Test and deploy to GitHub Pages

# One Pages site holds two copies: main at the root (the live site) and the staging branch at /staging/.
# A push to either branch tests that branch, then publishes both, so neither copy erases the other.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # queue rather than cancel: a cancelled run would skip testing the branch it was started for
  cancel-in-progress: false

jobs:
  test:
    # Playwright 1.44 installs its browser dependencies cleanly on 22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Model and data tests
        run: npm test
      - name: Every page loads with no errors, desktop and mobile
        run: npm run test:browser

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Assemble the static site (main at the root, staging at /staging/)
        run: |
          mkdir _site
          cp -R index.html og.png css js data wonk _site/
          if git rev-parse --verify --quiet origin/staging >/dev/null; then
            git worktree add --detach ../staging origin/staging
            mkdir _site/staging
            (cd ../staging && cp -R index.html og.png css js data wonk "$GITHUB_WORKSPACE/_site/staging/")
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
